<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>🎄 Merry Christmas</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ================= 配置 =================
  const CFG = {
    rows: 26,                              // 树的层数
    cols: 33,                              // 树最宽处的字符数
    printDur: 2400,                        // 打印树耗时（毫秒）
    greeting1: 'Merry Christmas',
    greeting2: '今年的圣诞节可以和你一起过吗？',
    lightChance: 0.10,                     // 彩灯密度
    snowCount: 90,
    leafChars: ['*', '✧', '✦', '✿', '❀', '·', '✱'],
    leafColors: ['#1c6b36', '#279348', '#37b45c', '#2aa14f', '#4fd276'],
    lightColors: ['#ff4d4d', '#ffd93d', '#59a8ff', '#ffffff', '#ff8ad8', '#7dffb0'],
    trunkChars: ['#', '▌'],
    trunkColor: '#8a6d3b'
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const staticCanvas = document.createElement('canvas');
  const sctx = staticCanvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let fontSize = 16, charW = 9, lineH = 17;
  let topY = 0;
  let treeBottomY = 0;

  let t0 = 0;               // 动画起点
  let state = 'print';      // print | lights | done
  let lightsOnAt = 0;
  let typed = 0;            // 已打出的字符数
  let typingDone = false;
  let greeted = false;

  const leaves = [];        // 静态字符 {x, y, ch, color}
  const lights = [];        // 彩灯 {x, y, color, phase, speed}
  let star = null;          // 树顶星
  let flakes = [];

  const now = () => performance.now();
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeOutBack = (p) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  };
  const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);

  // ================= 布局 =================
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    staticCanvas.width = canvas.width;
    staticCanvas.height = canvas.height;
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 字号：保证树 + 两行祝福语都放得下
    const fsW = (W * 0.92) / CFG.cols / 0.62;
    const fsH = (H * 0.84) / (CFG.rows + 5.5);
    fontSize = Math.max(9, Math.min(fsW, fsH, 26));
    charW = fontSize * 0.62;
    lineH = fontSize * 1.06;
    topY = Math.max(fontSize * 2.2, H * 0.085);
    treeBottomY = topY + CFG.rows * lineH;

    buildTree();
    buildSnow();
    reset();
  }

  function buildTree() {
    leaves.length = 0;
    lights.length = 0;

    const startX = W / 2 - (CFG.cols * charW) / 2;
    for (let r = 0; r < CFG.rows; r++) {
      const t = r / (CFG.rows - 1);
      const w = 1 + Math.round(t * (CFG.cols - 1));
      const y = topY + r * lineH;
      const off = Math.floor((CFG.cols - w) / 2);
      for (let i = 0; i < w; i++) {
        const x = startX + (off + i) * charW;
        if (Math.random() < CFG.lightChance) {
          lights.push({
            x: x,
            y: y,
            color: CFG.lightColors[Math.floor(Math.random() * CFG.lightColors.length)],
            phase: rand(0, Math.PI * 2),
            speed: rand(1.6, 3.6)
          });
        } else {
          leaves.push({
            x: x + charW * 0.02,
            y: y,
            ch: CFG.leafChars[Math.floor(Math.random() * CFG.leafChars.length)],
            color: CFG.leafColors[Math.floor(Math.random() * CFG.leafColors.length)]
          });
        }
      }
    }

    // 树干：树底下方两行
    const trunkW = 3;
    const trunkOff = Math.floor((CFG.cols - trunkW) / 2);
    for (let r = 0; r < 2; r++) {
      const y = treeBottomY + r * lineH;
      for (let i = 0; i < trunkW; i++) {
        leaves.push({
          x: startX + (trunkOff + i) * charW,
          y: y,
          ch: CFG.trunkChars[i % 2],
          color: CFG.trunkColor
        });
      }
    }

    // 树顶星星
    star = {
      x: W / 2,
      y: topY - lineH * 1.05,
      r: fontSize * 0.72
    };

    // 画静态层
    sctx.clearRect(0, 0, W, H);
    sctx.font = Math.round(fontSize) + 'px "Courier New", "Noto Sans Mono", monospace';
    sctx.textAlign = 'left';
    sctx.textBaseline = 'middle';
    for (let i = 0; i < leaves.length; i++) {
      const l = leaves[i];
      sctx.fillStyle = l.color;
      sctx.fillText(l.ch, l.x, l.y);
    }
  }

  function buildSnow() {
    flakes = [];
    for (let i = 0; i < CFG.snowCount; i++) {
      flakes.push({
        x: rand(0, W),
        y: rand(0, H),
        sp: rand(8, 30),
        sway: rand(0.3, 1.2),
        ph: rand(0, Math.PI * 2),
        ch: Math.random() < 0.5 ? '❄' : '·',
        a: rand(0.25, 0.6)
      });
    }
  }

  function reset() {
    t0 = now();
    state = 'print';
    typed = 0;
    typingDone = false;
    greeted = false;
    lightsOnAt = 0;
  }

  // ================= 绘制 =================
  function drawBg() {
    const g = ctx.createRadialGradient(W / 2, H * 0.42, 10, W / 2, H * 0.42, Math.max(W, H) * 0.75);
    g.addColorStop(0, '#071a0d');
    g.addColorStop(0.55, '#030b06');
    g.addColorStop(1, '#000000');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSnow(el, dt) {
    ctx.font = Math.round(fontSize * 0.7) + 'px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.sp * dt;
      if (f.y > H + 6) { f.y = -6; f.x = rand(0, W); }
      const x = f.x + Math.sin(el * f.sway + f.ph) * 10;
      ctx.globalAlpha = f.a;
      ctx.fillStyle = '#cfe8ff';
      ctx.fillText(f.ch, x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawStatic(el) {
    // 打印进度：按行裁剪
    const p = clamp((el * 1000) / CFG.printDur, 0, 1);
    const progress = CFG.rows * p;
    const clipBottom = topY - lineH + progress * lineH + lineH * 0.6;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, clipBottom);
    ctx.clip();
    ctx.drawImage(staticCanvas, 0, 0, W, H);
    ctx.restore();
  }

  function drawLights(el) {
    if (state === 'print') return;
    const t = (now() - lightsOnAt) / 1000;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < lights.length; i++) {
      const l = lights[i];
      const blink = 0.5 + 0.5 * Math.sin(t * l.speed + l.phase);
      if (blink < 0.25) continue;
      ctx.globalAlpha = clamp((blink - 0.25) / 0.75, 0, 1);
      ctx.fillStyle = l.color;
      ctx.font = Math.round(fontSize * (0.62 + 0.18 * blink)) + 'px "Courier New", monospace';
      ctx.fillText('✱', l.x, l.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawStar(el) {
    if (state === 'print') return;
    const t = clamp(((now() - lightsOnAt) / 1000) / 0.5, 0, 1);
    if (t <= 0) return;
    const s = easeOutBack(t) * star.r;
    const tw = 0.75 + 0.25 * Math.sin(el * 2.4);

    ctx.save();
    ctx.translate(star.x, star.y);
    // 光晕
    const halo = ctx.createRadialGradient(0, 0, 1, 0, 0, s * 3.4);
    halo.addColorStop(0, 'rgba(255,220,120,' + (0.5 * tw).toFixed(3) + ')');
    halo.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, s * 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(star.x, star.y);
    ctx.font = Math.round(fontSize * 0.95 * (0.6 + 0.4 * t)) + 'px "Segoe UI Symbol", "Noto Sans Symbols 2", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,224,140,' + tw.toFixed(3) + ')';
    ctx.shadowColor = 'rgba(255,200,90,0.9)';
    ctx.shadowBlur = 16;
    ctx.fillText('★', 0, 0);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawGreeting(el) {
    if (state === 'print') return;
    const startedAt = lightsOnAt + 500; // 星星亮起后 0.5 秒开始打字
    const typeSpeed = 42; // 每字毫秒
    const g1 = CFG.greeting1;
    const g2 = CFG.greeting2;
    const total = g1.length + g2.length;
    const elapsed = now() - startedAt;
    typed = clamp(Math.floor(elapsed / typeSpeed), 0, total);

    const show1 = Math.min(typed, g1.length);
    const show2 = Math.max(0, typed - g1.length);

    const y1 = treeBottomY + lineH * 2.1;
    const y2 = y1 + lineH * 1.75;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 第一行
    if (show1 > 0) {
      ctx.font = 'bold ' + Math.round(fontSize * 1.15) + 'px "Courier New", monospace';
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = 'rgba(255,200,60,0.7)';
      ctx.shadowBlur = 12;
      ctx.fillText(g1.slice(0, show1), W / 2, y1);
      ctx.shadowBlur = 0;
    }

    // 第二行
    if (show2 > 0) {
      ctx.font = Math.round(fontSize * 0.72) + 'px "Courier New", "PingFang SC", monospace';
      ctx.fillStyle = '#ffd9e6';
      ctx.fillText(g2.slice(0, show2), W / 2, y2);
    }

    // 光标
    const typingNow = typed < total;
    const cursorOn = typingNow || (Math.floor(now() / 550) % 2 === 0);
    if (cursorOn && show2 > 0) {
      const measure = ctx.measureText(g2.slice(0, show2)).width;
      ctx.fillStyle = 'rgba(255,217,230,0.85)';
      ctx.fillRect(W / 2 + measure / 2 + 4, y2 - fontSize * 0.42, fontSize * 0.34, fontSize * 0.8);
    }

    if (typed >= total) typingDone = true;
  }

  function drawHint(el) {
    if (!typingDone) return;
    const t = clamp(((now() - (lightsOnAt + 500 + (CFG.greeting1.length + CFG.greeting2.length) * 42)) / 800), 0, 1);
    if (t <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.28 * t;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#9ab8a4';
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText('轻触屏幕重播', W / 2, H - 22);
    ctx.restore();
  }

  // ================= 主循环 =================
  let lastT = now();

  function frame() {
    const n = now();
    const dt = Math.min((n - lastT) / 1000, 0.05);
    lastT = n;
    const el = (n - t0) / 1000;

    drawBg();
    drawSnow(el, dt);

    if (state === 'print' && (n - t0) >= CFG.printDur) {
      state = 'lights';
      lightsOnAt = n;
    }

    drawStatic(el);
    drawLights(el);
    drawStar(el);
    drawGreeting(el);
    drawHint(el);

    requestAnimationFrame(frame);
  }

  // ================= 交互 =================
  canvas.addEventListener('pointerdown', function () {
    reset();
  }, { passive: true });

  window.addEventListener('resize', function () { layout(); });
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
